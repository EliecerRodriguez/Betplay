name: NBA – Verificar y Registrar Modelo

on:
  # Semanal: lunes 05:00 UTC (00:00 Colombia) — verifica que el modelo del repo es válido
  schedule:
    - cron: "0 5 * * 1"

  # Manual desde Actions
  workflow_dispatch:

jobs:
  verify:
    name: Verificar y registrar modelo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencias ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Verificar modelo y registrar en Neon ─────────────────────────────
      # El entrenamiento REAL se hace localmente (python utils/train_and_publish.py)
      # porque CI no tiene el caché de partidos históricos (data/cache/*.parquet)
      # y stats.nba.com bloquea IPs de nube. Este workflow solo:
      #   1. Verifica que el modelo más reciente del repo es válido (carga OK)
      #   2. Registra sus métricas en Neon (model_registry) para comparación
      - name: Verify and register model
        env:
          PYTHONPATH:    ${{ github.workspace }}
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          LOG_LEVEL:     INFO
        run: |
          python - <<'EOF'
          import glob, os, joblib
          from sports.nba.model.predictor import _latest_model_version
          from utils.model_registry import register_model

          version = _latest_model_version()
          path = os.path.join("models", f"nba_model_{version}.joblib")
          if not os.path.exists(path):
              print(f"❌ Modelo {version} no encontrado en {path}")
              raise SystemExit(1)

          bundle = joblib.load(path)
          metrics = bundle.get("metrics", {})
          print(f"✅ Modelo {version} válido:")
          print(f"   Accuracy: {metrics.get('accuracy')}")
          print(f"   CV-AUC:   {metrics.get('cv_mean')}")
          print(f"   Muestras: {metrics.get('n_samples')}")
          print(f"   Features: {metrics.get('n_features')}")

          # Registrar en Neon (model_registry) para comparación de versiones
          try:
              register_model(version, path, promoted=True)
              print(f"✅ Modelo {version} registrado en Neon (model_registry)")
          except Exception as exc:
              print(f"⚠️ No se pudo registrar en Neon: {exc}")
          EOF

      # ── 5. Subir logs ───────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: verify-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
